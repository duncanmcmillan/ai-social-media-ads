<div class="page-header">
  <div class="page-title">Meta Setup Guides</div>
  <div class="page-sub">Step-by-step video walkthroughs to get your Meta account ready before creating campaigns.</div>
</div>

<div class="video-grid">
  @for (v of videos; track v.key) {
    <div class="video-card" [class.video-card--ready]="v.src">
      <div class="card-thumb" (click)="openVideo(v.key, v.src)" [class.card-thumb--clickable]="v.src">
        <svg class="thumb-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="23" stroke="currentColor" stroke-width="1.5" />
          @if (v.src) {
            <polygon points="19,15 37,24 19,33" fill="currentColor" />
          } @else {
            <line x1="16" y1="24" x2="32" y2="24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="24" y1="16" x2="24" y2="32" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          }
        </svg>
        @if (!v.src) {
          <span class="thumb-label">Coming soon</span>
        }
      </div>

      <div class="card-body">
        <div class="card-title">{{ v.title }}</div>
        <div class="card-desc">{{ v.description }}</div>
        <div class="card-topics">
          @for (t of v.topics; track t) {
            <span class="topic-chip">{{ t }}</span>
          }
        </div>
        <button
          class="card-btn"
          type="button"
          [disabled]="!v.src"
          (click)="openVideo(v.key, v.src)"
        >
          @if (v.src) {
            <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor" aria-hidden="true">
              <polygon points="3,1 12,6.5 3,12" />
            </svg>
            Watch Video
          } @else {
            Video Coming Soon
          }
        </button>
      </div>
    </div>
  }
</div>

@if (openKey()) {
  <app-video-modal
    [src]="openSrc"
    [title]="openTitle"
    (closed)="openKey.set(null)"
  />
}
